# Builds the Windows installer only when you choose (not on every push).
# This avoids publishing a constant stream of prerelease assets on a public repo.
# After moving the source repo private, you can re-enable push triggers if you want.

name: windows-installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:nsis
      - name: Compute version + paths
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Get-ChildItem -Recurse -File -Filter "ComunityWatch Setup $ver.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Installer exe not found for version $ver" }
          echo "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "INSTALLER_NAME=ComunityWatch-Setup-$ver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComunityWatch-Installer-${{ env.VERSION }}
          path: ${{ env.INSTALLER_PATH }}
      - name: Upload blockmap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComunityWatch-Blockmap-${{ env.VERSION }}
          path: |
            dist-eb/**/ComunityWatch Setup *.exe.blockmap
